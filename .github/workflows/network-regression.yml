name: Network quick regression
on:
  pull_request:
    paths:
      - "server/**"
      - "src/network/**"
      - "tests/network-*.test.mjs"
      - ".github/workflows/network-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:quick
